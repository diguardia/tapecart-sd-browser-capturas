<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b1b3a">
<title>Catálogo C64</title>
<style>
:root{--bg:#f4f3ef;--card:#fff;--fg:#1d1d1b;--muted:#6b6a65;--line:#dedcd5;--acc:#3b4cc0;--acc-bg:#e8eafb;--warn:#a5552a;--star:#d9a400;--head:#1b1b3a;--head-fg:#f2f2ff}
@media (prefers-color-scheme:dark){:root{--bg:#121214;--card:#1d1d21;--fg:#ecebe6;--muted:#9c9a92;--line:#303036;--acc:#9aa6ff;--acc-bg:#262a4a;--warn:#e0956b;--star:#ffc928;--head:#15152b}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--head);color:var(--head-fg);padding:10px 16px 8px;padding-top:max(10px,env(safe-area-inset-top))}
.top{display:flex;align-items:center;gap:8px}
h1{font-size:17px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabs{display:flex;gap:4px}
.tab{border:0;border-radius:16px;padding:6px 12px;font:inherit;font-size:13px;background:transparent;color:var(--head-fg);opacity:.75;cursor:pointer}
.tab[aria-selected=true]{background:rgba(255,255,255,.18);opacity:1}
.search{display:flex;gap:6px;margin-top:8px}
input[type=search],select{font:inherit;font-size:16px;padding:9px 10px;border:0;border-radius:8px;background:#fff;color:#1d1d1b;min-width:0}
input[type=search]{flex:1}
select{max-width:38%}
.az{display:flex;gap:2px;overflow-x:auto;margin:8px -16px 0;padding:0 16px 2px;scrollbar-width:none}
.az::-webkit-scrollbar{display:none}
.az button{flex:0 0 auto;min-width:30px;height:30px;border:0;border-radius:6px;font:inherit;font-size:13px;font-weight:600;background:rgba(255,255,255,.1);color:var(--head-fg);cursor:pointer}
.az button[aria-pressed=true]{background:#fff;color:var(--head)}
#info{padding:8px 16px 0;color:var(--muted);font-size:13px}
main{padding:8px 12px 24px;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:8px}
.c{display:flex;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px;align-items:stretch}
.shot{flex:0 0 128px;width:128px;aspect-ratio:8/5;border-radius:6px;background:#000;overflow:hidden;border:0;padding:0;cursor:zoom-in}
.shot img{width:100%;height:100%;display:block;image-rendering:pixelated}
.shot.none{display:flex;align-items:center;justify-content:center;color:#777;font-size:11px;cursor:default}
.b{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.t{font-weight:600;line-height:1.25}
.m{color:var(--muted);font-size:12.5px}
.path{margin-top:auto;font-family:ui-monospace,Consolas,monospace;font-size:13px;color:var(--acc);background:var(--acc-bg);border-radius:6px;padding:3px 6px;overflow-wrap:anywhere}
.no{color:var(--warn);font-size:12px}
.fav{flex:0 0 auto;align-self:flex-start;border:0;background:none;font-size:24px;line-height:1;color:var(--line);cursor:pointer;padding:2px}
.fav[aria-pressed=true]{color:var(--star)}
#more{display:block;margin:4px auto 32px;padding:10px 20px;font:inherit;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--fg);cursor:pointer}
#more[hidden]{display:none}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:40px 16px}
dialog{border:0;padding:0;background:transparent;max-width:min(96vw,960px);width:100%}
dialog::backdrop{background:rgba(0,0,0,.85)}
dialog img{width:100%;display:block;image-rendering:pixelated;border-radius:6px}
dialog .cap{color:#fff;padding:10px 4px;font-size:15px}
dialog .cap .path{display:inline-block;margin-top:6px}
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>Catálogo C64</h1>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="tAll" aria-selected="true">Todos</button>
      <button class="tab" role="tab" id="tFav" aria-selected="false">★ Favoritos</button>
    </div>
  </div>
  <div class="search">
    <input type="search" id="q" placeholder="Buscar juego o editor" autocomplete="off">
    <select id="gen"><option value="">Género</option></select>
  </div>
  <div class="az" id="az"></div>
</header>
<div id="info"></div>
<main id="grid"></main>
<button id="more" hidden>Mostrar más</button>
<dialog id="dlg"><img id="dimg" alt=""><div class="cap" id="dcap"></div></dialog>
<script>
const D=__DATA__;
const $=s=>document.querySelector(s);
const KEY='c64fav';
let favs=new Set();
try{favs=new Set(JSON.parse(localStorage.getItem(KEY)||'[]'))}catch(e){}
const saveFavs=()=>{try{localStorage.setItem(KEY,JSON.stringify([...favs]))}catch(e){}};
const id=r=>r.f+'/'+r.n;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pretty=f=>f.split('/').join(' › ');
const first=t=>{const c=t.replace(/^(the|a|an) /i,'').charAt(0).toUpperCase();return /[A-Z]/.test(c)?c:'#'};
D.forEach(r=>r.k=first(r.t));
for(const g of [...new Set(D.map(r=>r.g).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'es')))$('#gen').add(new Option(g,g));
const letters=['#',...'ABCDEFGHIJKLMNOPQRSTUVWXYZ'];
$('#az').innerHTML='<button data-l="" aria-pressed="true">Todo</button>'+letters.map(l=>`<button data-l="${l}" aria-pressed="false">${l}</button>`).join('');
let letter='',onlyFav=false,list=[],shown=0;const PAGE=60;
function card(r,i){
  const shot=r.i?`<button class="shot" data-i="${i}" aria-label="Ver captura"><img loading="lazy" src="img/${r.i}" alt=""></button>`:`<div class="shot none">sin captura</div>`;
  const meta=[r.y,r.g,r.p].filter(Boolean).map(esc).join(' · ');
  const on=favs.has(id(r));
  return `<div class="c">${shot}<div class="b"><div class="t">${esc(r.t)}</div>`+
    (meta?`<div class="m">${meta}</div>`:'')+
    (r.ok?'':`<div class="no">No carga en el tapecart (${esc(r.x)})</div>`)+
    `<div class="path">${esc(pretty(r.f))} › ${esc(r.n)}</div></div>`+
    `<button class="fav" data-i="${i}" aria-pressed="${on}" aria-label="Favorito">★</button></div>`;
}
function render(reset){
  if(reset){$('#grid').innerHTML='';shown=0;window.scrollTo(0,0)}
  if(!list.length){$('#grid').innerHTML=`<div class="empty">${onlyFav?'Todavía no marcaste favoritos. Tocá la ★ de un juego.':'No hay juegos que coincidan.'}</div>`}
  const part=list.slice(shown,shown+PAGE);
  $('#grid').insertAdjacentHTML('beforeend',part.map((r,j)=>card(r,shown+j)).join(''));
  shown+=part.length;
  $('#more').hidden=shown>=list.length;
}
function apply(){
  const q=$('#q').value.trim().toLowerCase(),g=$('#gen').value;
  list=D.filter(r=>(!onlyFav||favs.has(id(r)))&&(!g||r.g===g)&&(!letter||r.k===letter)&&
    (!q||(r.t+' '+r.p+' '+r.n).toLowerCase().includes(q)));
  $('#info').textContent=list.length+(list.length===1?' juego':' juegos');
  render(true);
}
$('#q').addEventListener('input',apply);
$('#gen').addEventListener('input',apply);
$('#az').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  letter=b.dataset.l;$('#az').querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));apply()});
function setTab(fav){onlyFav=fav;$('#tAll').setAttribute('aria-selected',!fav);$('#tFav').setAttribute('aria-selected',fav);apply()}
$('#tAll').addEventListener('click',()=>setTab(false));
$('#tFav').addEventListener('click',()=>setTab(true));
$('#grid').addEventListener('click',e=>{
  const f=e.target.closest('.fav');
  if(f){const r=list[+f.dataset.i];const k=id(r);favs.has(k)?favs.delete(k):favs.add(k);saveFavs();f.setAttribute('aria-pressed',favs.has(k));return}
  const s=e.target.closest('button.shot');
  if(s){const r=list[+s.dataset.i];$('#dimg').src='img/'+r.i;
    $('#dcap').innerHTML=`<b>${esc(r.t)}</b> ${r.y?'('+esc(r.y)+')':''}<br><span class="path">${esc(pretty(r.f))} › ${esc(r.n)}</span>`;$('#dlg').showModal()}
});
$('#dlg').addEventListener('click',()=>$('#dlg').close());
$('#more').addEventListener('click',()=>render(false));
apply();
</script>
</body>
</html>
